name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      # The standard edition, not extended. The stylesheet is plain CSS — Pico
      # ships compiled and the overrides need no preprocessing — so there is no
      # Sass to transpile, and no image processing either. Everything the
      # templates use (resources.Concat, minify, fingerprint) is in the standard
      # build. Switch back to hugo_extended_ if Sass or WebP is ever introduced.
      - name: Install Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      # v4 stopped bundling dotfiles into the artifact. Hugo emits none into
      # ./public, so the default exclusion is left alone rather than turning
      # `include-hidden-files` back on.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
