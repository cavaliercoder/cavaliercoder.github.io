baseURL = "https://cavaliercoder.com/"
locale = "en-au"
title = "Ryan Armstrong's Blog"
enableRobotsTXT = true

# No taxonomies are used, and RSS is only wanted for the home page.
disableKinds = ["taxonomy", "term"]

[params]
  description = "Systems software, storage and reliability at scale."
  cdnurl = "https://cdn.cavaliercoder.com/blog"
  # Cloudflare Web Analytics site tag, from the dashboard's JS snippet. A public
  # identifier, not a credential. Empty disables the beacon entirely; see
  # layouts/_partials/analytics.html.
  cloudflareAnalyticsToken = "7624490e850149ccb633e50613f9cc09"
  # Go projects live in the cavaliergopher org; everything else, and the
  # archive, remains under the personal account.
  github_username = "cavaliercoder"
  github_org = "cavaliergopher"

# The home page is the curated post list, so Posts points at it. Defined here
# rather than in front matter because the home page has no content file of its
# own. `pageRef` rather than `url`, or the entry has no page behind it and
# `IsMenuCurrent` can never mark it. The other menu items are declared
# alongside the pages they open.
[[menus.main]]
  name = "Posts"
  pageRef = "/"
  weight = 20

# Preserve the URLs minted by Jekyll: /blog/:title.html. Posts that set `url`
# in front matter (e.g. /jclouds) override this. The .html suffix comes from
# uglyURLs rather than the pattern, or Hugo would treat it as a directory name.
[permalinks.page]
  posts = "/blog/:slug"

[uglyURLs]
  posts = true

[outputs]
  home = ["html", "rss"]
  page = ["html"]
  section = ["html"]

# Jekyll published the feed at /feed.xml, not Hugo's default /index.xml.
[outputFormats.rss]
  baseName = "feed"

[markup.goldmark.renderer]
  # Posts embed raw HTML (lightbox anchors, jQuery demos) alongside Markdown.
  unsafe = true

[markup.highlight]
  # Emit Chroma classes so assets/css/custom.css keeps styling code blocks.
  noClasses = false
  lineNos = false

